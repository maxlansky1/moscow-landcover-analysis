[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-landcover"
version = "1.0.0"
description = "Анализ динамики земного покрова Москвы (2000–2026) по снимкам Landsat в Google Earth Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "maxlansky1" }]
keywords = ["remote-sensing", "google-earth-engine", "landsat", "land-cover", "moscow"]
dependencies = [
    "loguru==0.7.3",
    "earthengine-api==1.7.39",
    "geemap==0.38.8",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "numpy",
    "scipy",
    "tqdm",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbstripout"]

[project.scripts]
mlc = "moscow_landcover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
